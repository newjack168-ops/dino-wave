<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>小恐龍波動大冒險 2.0</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:linear-gradient(#dff5ff,#f4fff1);

font-family:Arial,"Microsoft JhengHei",sans-serif;

color:#234;

text-align:center;

}

.wrap{max-width:650px;margin:auto;padding:12px}

h1{font-size:25px;color:#087d66}

.card{

background:white;

border-radius:18px;

padding:15px;

margin:12px 0;

box-shadow:0 4px 14px #b8d6df;

}

button{

border:0;

border-radius:12px;

padding:13px 18px;

margin:5px;

font-size:17px;

font-weight:bold;

background:#16a085;

color:white;

}

button:disabled{opacity:.45}

.stats{

display:flex;

justify-content:space-around;

flex-wrap:wrap;

gap:10px;

font-weight:bold;

}

canvas{

width:100%;

height:auto;

border-radius:12px;

background:#dff6ff;

touch-action:manipulation;

}

.jump{

background:#ff9800;

font-size:23px;

width:90%;

}

.options{

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

}

.options button{

background:#2980b9;

font-size:15px;

min-height:60px;

margin:0;

}

#question{

font-size:19px;

font-weight:bold;

line-height:1.6;

}

#message{color:#d35400;font-weight:bold}

#explain{color:#176a55;line-height:1.6}

.hidden{display:none}

.badge{

display:inline-block;

background:#e8f8f0;

border-radius:10px;

padding:8px;

margin:5px;

}

</style>

</head>

<body>

<div class="wrap">

<h1>🦖 小恐龍波動大冒險 2.0</h1>

<div class="card stats">

<span>⭐ <span id="score">0</span></span>

<span>❤️ 復活 <span id="revives">0</span>/2</span>

<span>🏁 第<span id="level">1</span>關</span>

<span>🏆 <span id="best">0</span></span>

</div>

<div class="card">

<h2 id="dinoName">🦖 Lv.1 小恐龍</h2>

<div id="trainingInfo">

答對題目強化恐龍！

</div>

</div>

<div class="card" id="training">

<h2>📚 恐龍訓練營</h2>

<p>不限答題次數，答對10題進化傳說龍！</p>

<div class="badge">

答對：<span id="correct">0</span>題

</div>

<div id="trainQuestion"></div>

<div class="options" id="trainOptions"></div>

<p id="trainExplain"></p>

<button onclick="startGame()">▶ 開始冒險</button>

</div>

<div class="card hidden" id="gameArea">

<canvas id="game" width="600" height="280"></canvas>

<button class="jump" onclick="jump()">🦖 跳躍</button>

<div id="message">準備冒險！</div>

<div>

<button onclick="restart()">🔄 重新開始</button>

</div>

</div>

<div class="card hidden" id="quizArea">

<h2 id="quizTitle">❤️ 復活挑戰</h2>

<div id="question"></div>

<div class="options" id="options"></div>

<p id="explain"></p>

</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let state="training";

let score=0,level=1,correct=0,revives=0;

let frame=0,speed=4,shield=0,boost=0;

let obstacles=[],items=[];

let dino={x:75,y:185,vy:0,jumps:0};

let currentQuestion=null;

let questionMode="";

let bossHP=0,bossActive=false;

let lastQuestion=-1;

let best=Number(localStorage.getItem("dinoWaveBest")||0);

document.getElementById("best").textContent=best;

const questions=[

["波形最高點稱為？",["波峰","波谷","波長","週期"],0,"波峰是波形最高的位置。"],

["波形最低點稱為？",["振幅","波谷","頻率","波速"],1,"波谷是波形最低的位置。"],

["相鄰兩波峰的距離是？",["振幅","頻率","波長","週期"],2,"相鄰波峰間的距離是一個波長。"],

["波峰到平衡位置的距離是？",["振幅","波速","波長","頻率"],0,"振幅是偏離平衡位置的最大距離。"],

["每秒振動次數稱為？",["週期","頻率","波速","波長"],1,"頻率是每秒振動次數。"],

["頻率單位是？",["秒","公尺","赫茲","牛頓"],2,"頻率單位為Hz。"],

["波速公式是？",["頻率×波長","頻率÷波長","波長÷頻率","振幅×頻率"],0,"波速＝頻率×波長。"],

["頻率2Hz，週期？",["2秒","0.5秒","4秒","1秒"],1,"週期＝1÷頻率。"],

["頻率5Hz，週期？",["5秒","1秒","0.2秒","10秒"],2,"1÷5＝0.2秒。"],

["週期0.25秒，頻率？",["4Hz","2Hz","0.25Hz","8Hz"],0,"1÷0.25＝4Hz。"],

["橫波振動方向與傳播方向？",["平行","垂直","相同","無關"],1,"橫波振動方向垂直於傳播方向。"],

["縱波振動方向與傳播方向？",["垂直","平行","相反","無關"],1,"縱波振動方向平行於傳播方向。"],

["波主要傳遞什麼？",["物質","能量","空氣","水"],1,"波主要傳遞能量。"],

["空氣中的聲波屬於？",["橫波","縱波","電磁波","光波"],1,"聲波在空氣中屬於縱波。"],

["繩波通常屬於？",["橫波","縱波","聲波","無法傳播"],0,"繩波通常是橫波。"],

["頻率10Hz，每秒振動？",["1次","5次","10次","100次"],2,"10Hz表示每秒振動10次。"],

["波速12m/s、頻率3Hz，波長？",["4m","9m","15m","36m"],0,"12÷3＝4m。"],

["波速20m/s、波長5m，頻率？",["100Hz","4Hz","15Hz","25Hz"],1,"20÷5＝4Hz。"],

["頻率越高表示？",["振動越慢","振動越快","振幅越大","波長一定越大"],1,"頻率越高，每秒振動次數越多。"],

["波速固定，頻率加倍，波長？",["加倍","減半","不變","四倍"],1,"波速固定時，頻率與波長成反比。"]

];

const bossQuestions=[

["波長4m、頻率5Hz，波速？",["9m/s","20m/s","1.25m/s","25m/s"],1,"4×5＝20m/s。"],

["波長3m、頻率6Hz，波速？",["18m/s","9m/s","2m/s","36m/s"],0,"3×6＝18m/s。"],

["波速24m/s、頻率6Hz，波長？",["30m","4m","18m","144m"],1,"24÷6＝4m。"],

["波速30m/s、波長5m，頻率？",["150Hz","25Hz","6Hz","35Hz"],2,"30÷5＝6Hz。"],

["波長2m、頻率8Hz，波速？",["4m/s","10m/s","16m/s","6m/s"],2,"2×8＝16m/s。"]

];

function rand(a,b){return Math.random()*(b-a)+a}

function getDinoLevel(){

if(correct>=10)return 5;

if(correct>=7)return 4;

if(correct>=4)return 3;

if(correct>=2)return 2;

return 1;

}

function updateDino(){

let lv=getDinoLevel();

let names=[

"🦖 Lv.1 小恐龍",

"🦕 Lv.2 迅猛龍",

"🛡️ Lv.3 裝甲龍",

"⚡ Lv.4 雷電龍",

"🐉 Lv.5 傳說龍"

];

document.getElementById("dinoName").textContent=names[lv-1];

document.getElementById("trainingInfo").textContent=

lv===5?"傳說龍！雙護盾＋二段跳＋強化跳躍":

lv===4?"雷電龍！強化跳躍＋二段跳":

lv===3?"裝甲龍！開場護盾＋二段跳":

lv===2?"迅猛龍！可以二段跳":

"小恐龍！答對2題解鎖二段跳";

document.getElementById("correct").textContent=correct;

}

function pickQuestion(boss=false){

let arr=boss?bossQuestions:questions;

let n=Math.floor(Math.random()*arr.length);

if(arr.length>1){

while(n===lastQuestion)n=Math.floor(Math.random()*arr.length);

}

lastQuestion=n;

return arr[n];

}

function showTrainingQuestion(){

let q=pickQuestion();

currentQuestion=q;

document.getElementById("trainQuestion").textContent=q[0];

document.getElementById("trainExplain").textContent="";

makeOptions("trainOptions",q,answerTraining);

}

function makeOptions(id,q,callback){

let box=document.getElementById(id);

box.innerHTML="";

q[1].forEach((v,i)=>{

let b=document.createElement("button");

b.textContent=String.fromCharCode(65+i)+"．"+v;

b.onclick=()=>callback(i);

box.appendChild(b);

});

}

function answerTraining(i){

let q=currentQuestion;

document.querySelectorAll("#trainOptions button")

.forEach(b=>b.disabled=true);

if(i===q[2]){

correct++;

updateDino();

document.getElementById("trainExplain").textContent=

"✅ 答對！"+q[3];

}else{

document.getElementById("trainExplain").textContent=

"❌ 答錯！"+q[3];

}

setTimeout(()=>{

if(state==="training")showTrainingQuestion();

},1100);

}

function updateStats(){

document.getElementById("score").textContent=score;

document.getElementById("revives").textContent=revives;

document.getElementById("level").textContent=level;

if(score>best){

best=score;

localStorage.setItem("dinoWaveBest",best);

document.getElementById("best").textContent=best;

}

}

function startGame(){

state="running";

score=0;level=1;revives=0;

frame=0;speed=4;boost=0;

obstacles=[];items=[];

bossHP=0;bossActive=false;

dino.y=185;dino.vy=0;dino.jumps=0;

shield=getDinoLevel()>=5?2:

getDinoLevel()>=3?1:0;

document.getElementById("training").classList.add("hidden");

document.getElementById("gameArea").classList.remove("hidden");

document.getElementById("quizArea").classList.add("hidden");

document.getElementById("message").textContent="🦖 冒險開始！";

updateStats();

}

function jump(){

if(state!=="running")return;

let maxJumps=getDinoLevel()>=2?2:1;

if(dino.jumps>=maxJumps)return;

dino.vy=getDinoLevel()>=4?-13:-11;

dino.jumps++;

}

function die(){

if(shield>0){

shield--;

document.getElementById("message").textContent=

"🛡️ 護盾抵擋一次傷害！";

return;

}

if(revives>=2){

gameOver();

return;

}

state="quiz";

questionMode="revive";

showQuiz();

}

function showQuiz(){

document.getElementById("quizArea").classList.remove("hidden");

let q=pickQuestion(questionMode==="boss");

currentQuestion=q;

document.getElementById("quizTitle").textContent=

questionMode==="boss"?"👾 Boss 波速挑戰":"❤️ 復活挑戰";

document.getElementById("question").textContent=q[0];

document.getElementById("explain").textContent="";

makeOptions("options",q,answerQuiz);

}

function answerQuiz(i){

let q=currentQuestion;

document.querySelectorAll("#options button")

.forEach(b=>b.disabled=true);

let ok=i===q[2];

document.getElementById("explain").textContent=

(ok?"✅ 答對！":"❌ 答錯！")+q[3];

if(questionMode==="revive"){

if(ok){

revives++;

setTimeout(()=>{

document.getElementById("quizArea").classList.add("hidden");

obstacles=[];

dino.y=185;dino.vy=0;dino.jumps=0;

shield=Math.max(shield,1);

state="running";

updateStats();

},1200);

}else{

setTimeout(gameOver,1200);

}

}else{

if(ok){

bossHP--;

score+=50;

}

setTimeout(()=>{

if(bossHP<=0){

bossActive=false;

score+=100;

shield++;

document.getElementById("quizArea").classList.add("hidden");

state="running";

updateStats();

}else if(ok){

showQuiz();

}else{

document.getElementById("quizArea").classList.add("hidden");

state="running";

}

},1200);

}

}

function gameOver(){

state="over";

document.getElementById("quizArea").classList.add("hidden");

document.getElementById("message").textContent=

"💀 遊戲結束！總分："+score+"分";

updateStats();

}

function restart(){

state="training";

correct=0;revives=0;score=0;

document.getElementById("training").classList.remove("hidden");

document.getElementById("gameArea").classList.add("hidden");

document.getElementById("quizArea").classList.add("hidden");

updateDino();

showTrainingQuestion();

updateStats();

}

function collision(o){

return dino.x<o.x+o.w &&

dino.x+38>o.x &&

dino.y<o.y+o.h &&

dino.y+40>o.y;

}

function draw(){

requestAnimationFrame(draw);

ctx.clearRect(0,0,600,280);

ctx.fillStyle="#dff6ff";

ctx.fillRect(0,0,600,280);

ctx.strokeStyle="#42b8db";

ctx.lineWidth=3;

ctx.beginPath();

for(let x=0;x<=600;x+=4){

let y=55+18*Math.sin((x+frame*2)/35);

if(x===0)ctx.moveTo(x,y);

else ctx.lineTo(x,y);

}

ctx.stroke();

ctx.fillStyle="#82ce8c";

ctx.fillRect(0,230,600,50);

ctx.font="14px Arial";

ctx.fillStyle="#176a86";

ctx.fillText("🌊 波峰・波谷・波長・頻率・波速",12,22);

if(state==="running"){

frame++;

level=Math.floor(score/150)+1;

speed=4+Math.min(level*.4,3);

dino.vy+=.6;

dino.y+=dino.vy;

if(dino.y>=185){

dino.y=185;

dino.vy=0;

dino.jumps=0;

}

if(frame%95===0){

obstacles.push({

x:610,y:203,w:25,h:27

});

}

if(frame%170===0){

items.push({

x:610,y:150,w:25,h:25,

type:Math.floor(Math.random()*3)

});

}

obstacles.forEach(o=>{

o.x-=speed;

if(collision(o)){

o.x=-100;

die();

}

});

items.forEach(o=>{

o.x-=speed;

if(collision(o)){

o.x=-100;

if(o.type===0)shield++;

if(o.type===1)score+=30;

if(o.type===2)boost=180;

}

});

obstacles=obstacles.filter(o=>o.x>-40);

items=items.filter(o=>o.x>-40);

if(boost>0){

boost--;

score+=1;

}

if(frame%30===0)score+=5;

if(score>=level*150 && !bossActive && frame>200){

bossActive=true;

bossHP=3;

state="quiz";

questionMode="boss";

showQuiz();

}

updateStats();

}

ctx.font="43px Arial";

let icon=getDinoLevel()>=5?"🐉":

getDinoLevel()>=4?"⚡":

getDinoLevel()>=3?"🦖":

getDinoLevel()>=2?"🦕":"🦖";

ctx.fillText(icon,dino.x,dino.y+40);

obstacles.forEach(o=>{

ctx.fillStyle="#795548";

ctx.beginPath();

ctx.moveTo(o.x,o.y+o.h);

ctx.lineTo(o.x+o.w/2,o.y);

ctx.lineTo(o.x+o.w,o.y+o.h);

ctx.fill();

});

items.forEach(o=>{

ctx.font="25px Arial";

ctx.fillText(["🛡️","💰","⚡"][o.type],o.x,o.y+23);

});

if(shield>0){

ctx.strokeStyle="#a35cff";

ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(dino.x+20,dino.y+20,32,0,Math.PI*2);

ctx.stroke();

}

if(bossActive){

ctx.font="35px Arial";

ctx.fillText("👾",515,140);

ctx.fillStyle="#e74c3c";

ctx.fillText("❤️".repeat(Math.max(0,bossHP)),480,175);

}

}

canvas.addEventListener("pointerdown",jump);

document.addEventListener("keydown",e=>{

if(e.code==="Space"){

e.preventDefault();

jump();

}

});

updateDino();

showTrainingQuestion();

draw();

</script>

</body>

</html>
