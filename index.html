/* ==========================

   3. 音效

========================== */

let soundOn = true;

let audioCtx = null;

function unlockAudio(){

  if(!soundOn)return;

  try{

    if(!audioCtx){

      audioCtx = new (

        window.AudioContext ||

        window.webkitAudioContext

      )();

    }

    if(audioCtx.state==="suspended"){

      audioCtx.resume();

    }

  }catch(e){}

}

function beep(freq=440,duration=0.12,type="sine",volume=0.12){

  if(!soundOn)return;

  try{

    unlockAudio();

    if(!audioCtx)return;

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.type = type;

    osc.frequency.setValueAtTime(freq,audioCtx.currentTime);

    gain.gain.setValueAtTime(

      volume,

      audioCtx.currentTime

    );

    gain.gain.exponentialRampToValueAtTime(

      0.001,

      audioCtx.currentTime+duration

    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(audioCtx.currentTime+duration);

  }catch(e){}

}

function playCorrect(){

  beep(650,0.1);

  setTimeout(()=>beep(900,0.15),100);

}

function playWrong(){

  beep(180,0.2,"sawtooth",0.08);

}

function playEvolve(){

  beep(450,0.12);

  setTimeout(()=>beep(600,0.12),130);

  setTimeout(()=>beep(850,0.18),260);

  setTimeout(()=>beep(1100,0.3),400);

}

function playJump(){

  beep(480,0.11,"square",0.055);

}

function playItem(){

  beep(900,0.09);

  setTimeout(()=>beep(1200,0.12),90);

}

function playHit(){

  beep(120,0.35,"sawtooth",0.12);

}

/* ==========================

   4. 訓練營與進化

========================== */

let correct=0;

let evolutionLevel=1;

let usedQuestions=[];

let currentQuestion=null;

let answered=false;

const evolutionNames=[

  "",

  "🥚 Lv.1 小恐龍",

  "🦖 Lv.2 強壯恐龍",

  "🦕 Lv.3 巨型恐龍",

  "🐲 Lv.4 神龍",

  "🐉 Lv.5 傳說龍"

];

function getEvolutionLevel(n){

  if(n>=10)return 5;

  if(n>=7)return 4;

  if(n>=4)return 3;

  if(n>=2)return 2;

  return 1;

}

function updateEvolution(){

  const newLevel=getEvolutionLevel(correct);

  if(newLevel>evolutionLevel){

    evolutionLevel=newLevel;

    playEvolve();

    $("feedback").textContent=

      "🎉 恭喜進化！"+evolutionNames[evolutionLevel];

  }

  $("evolution").textContent=

    evolutionNames[evolutionLevel];

  $("correctCount").textContent=correct;

}

function shuffle(arr){

  for(let i=arr.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [arr[i],arr[j]]=[arr[j],arr[i]];

  }

  return arr;

}

function nextQuestion(){

  answered=false;

  $("nextBtn").classList.add("hidden");

  $("feedback").textContent="";

  if(usedQuestions.length===0){

    usedQuestions=shuffle(

      questionBank.map((_,i)=>i)

    );

  }

  const index=usedQuestions.pop();

  currentQuestion=questionBank[index];

  $("question").textContent=currentQuestion[0];

  const options=$("options");

  options.innerHTML="";

  const order=shuffle([0,1,2,3]);

  order.forEach(i=>{

    const btn=document.createElement("button");

    btn.className="option";

    btn.textContent=currentQuestion[i+1];

    btn.onclick=()=>answerQuestion(i);

    options.appendChild(btn);

  });

}

function answerQuestion(i){

  if(answered)return;

  unlockAudio();

  answered=true;

  const right=currentQuestion[5];

  if(i===right){

    correct++;

    playCorrect();

    $("feedback").textContent="✅ 答對了！";

    updateEvolution();

  }else{

    playWrong();

    $("feedback").textContent=

      "❌ 答錯了！正確答案："+currentQuestion[right+1];

  }

  $("nextBtn").classList.remove("hidden");

}

$("nextBtn").onclick=nextQuestion;

  unlockAudio();

  trainingPanel.classList.add("hidden");

  gamePanel.classList.remove("hidden");

  resetGame();

  running=true;

  lastTime=0;

  setTimeout(()=>beep(750,0.15),120);

  cancelAnimationFrame(animationId);

  animationId=requestAnimationFrame(loop);

/* ==========================

   6. 跳躍與蹲下

========================== */

function jump(){

  if(!running)return;

  unlockAudio();

  if(dino.jumps>=2)return;

  // 蹲下時不能跳

  if(ducking)return;

  dino.vy=dino.jumps===0?-13.5:-12.5;

  dino.jumps++;

  dino.onGround=false;

  playJump();

}

function setDuck(value){

  if(!running)return;

  ducking=value;

  $("duckBtn").classList.toggle("pressed",value);

}

$("jumpBtn").addEventListener("pointerdown",e=>{

  e.preventDefault();

  jump();

});

$("duckBtn").addEventListener("pointerdown",e=>{

  e.preventDefault();

  unlockAudio();

  try{

    $("duckBtn").setPointerCapture(e.pointerId);

  }catch(err){}

  setDuck(true);

});

$("duckBtn").addEventListener("pointerup",e=>{

  e.preventDefault();

  setDuck(false);

});

$("duckBtn").addEventListener("pointercancel",()=>{

  setDuck(false);

});

$("duckBtn").addEventListener("lostpointercapture",()=>{

  setDuck(false);

});

window.addEventListener("blur",()=>{

  ducking=false;

  $("duckBtn").classList.remove("pressed");

});

// 電腦也能玩

document.addEventListener("keydown",e=>{

  if(e.code==="Space"||e.code==="ArrowUp"){

    e.preventDefault();

    if(!e.repeat)jump();

  }

  if(e.code==="ArrowDown"){

    e.preventDefault();

    setDuck(true);

  }

});

document.addEventListener("keyup",e=>{

  if(e.code==="ArrowDown"){

    setDuck(false);

  }

});

/* ==========================

   7. 障礙物與掉寶

========================== */

function spawnObstacle(){

  // 第二關開始才有飛鳥

  const canBird=level>=2;

  const isBird=

    canBird&&Math.random()<0.42;

  if(isBird){

    obstacles.push({

      type:"bird",

      x:W+30,

      y:GROUND-66,

      w:57,

      h:27,

      flap:0

    });

  }else{

    obstacles.push({

      type:"rock",

      x:W+30,

      y:GROUND-38,

      w:39,

      h:38

    });

  }

}

function spawnItem(){

  const r=Math.random();

  let type="gem";

  if(r<0.16)type="shield";

  else if(r<0.25)type="boost";

  items.push({

    type,

    x:W+30,

    y:GROUND-110-Math.random()*35,

    w:30,

    h:30,

    phase:Math.random()*6

  });

}

function intersects(a,b){

  return (

    a.x<b.x+b.w &&

    a.x+a.w>b.x &&

    a.y<b.y+b.h &&

    a.y+a.h>b.y

  );

}

function dinoHitbox(){

  const h=ducking&&dino.onGround?32:60;

  return {

    x:dino.x+10,

    y:dino.y+(60-h)+5,

    w:dino.w-19,

    h:h-10

  };

}

function hitObstacle(index){

  obstacles.splice(index,1);

  if(shields>0){

    shields--;

    playHit();

    $("message").textContent=

      "🛡️ 護盾抵擋一次碰撞！";

    return;

  }

  gameOver();

}

function collectItem(index){

  const item=items[index];

  if(item.type==="gem"){

    gems++;

    score+=100;

    $("message").textContent=

      "💎 獲得寶石！+100分";

  }

  if(item.type==="shield"){

    shields=Math.min(3,shields+1);

    $("message").textContent=

      "🛡️ 獲得護盾！";

  }

  if(item.type==="boost"){

    score+=250;

    $("message").textContent=

      "⚡ 能量獎勵！+250分";

  }

  playItem();

  items.splice(index,1);

}

/* ==========================

   8. 速度與關卡

========================== */

function updateDifficulty(){

  // 每累積一定距離升一關

  level=Math.min(

    20,

    Math.floor(distance/850)+1

  );

  // 速度由4逐漸增加至12

  speed=Math.min(

    12,

    4+distance/1050

  );

}

/* ==========================

   9. 遊戲更新

========================== */

function update(dt){

  frame+=dt;

  distance+=speed*dt;

  score+=speed*0.09*dt;

  updateDifficulty();

  // 重力

  dino.vy+=0.66*dt;

  dino.y+=dino.vy*dt;

  if(dino.y>=GROUND-60){

    dino.y=GROUND-60;

    dino.vy=0;

    dino.jumps=0;

    dino.onGround=true;

  }else{

    dino.onGround=false;

  }

  // 產生障礙物

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnObstacle();

    // 速度越快，障礙物間隔越短

    spawnTimer=

      Math.max(52,130-speed*5)+

      Math.random()*45;

  }

  // 產生掉寶

  itemTimer-=dt;

  if(itemTimer<=0){

    spawnItem();

    itemTimer=190+Math.random()*140;

  }

  const hitbox=dinoHitbox();

  for(let i=obstacles.length-1;i>=0;i--){

    const o=obstacles[i];

    o.x-=speed*dt;

    if(o.type==="bird"){

      o.flap+=0.25*dt;

    }

    if(o.x+o.w<0){

      obstacles.splice(i,1);

      continue;

    }

    if(intersects(hitbox,o)){

      hitObstacle(i);

      if(!running)return;

    }

  }

  for(let i=items.length-1;i>=0;i--){

    const item=items[i];

    item.x-=speed*dt;

    item.phase+=0.08*dt;

    if(item.x+item.w<0){

      items.splice(i,1);

      continue;

    }

    const box={

      x:item.x,

      y:item.y+Math.sin(item.phase)*6,

      w:item.w,

      h:item.h

    };

    if(intersects(hitbox,box)){

      collectItem(i);

    }

  }

  updateStats();

}

/* ==========================

   10. 畫面繪製

========================== */

function drawBackground(){

  const sky=ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,"#a9e4ff");

  sky.addColorStop(1,"#effcff");

  ctx.fillStyle=sky;

  ctx.fillRect(0,0,W,H);

  // 太陽

  ctx.fillStyle="#ffe16b";

  ctx.beginPath();

  ctx.arc(620,65,30,0,Math.PI*2);

  ctx.fill();

  // 雲朵

  for(let i=0;i<4;i++){

    const x=(

      i*220+110-distance*0.12

    )%950;

    const px=(x+950)%950-80;

    const py=48+(i%2)*45;

    ctx.fillStyle="rgba(255,255,255,.85)";

    ctx.beginPath();

    ctx.ellipse(px,py,43,16,0,0,Math.PI*2);

    ctx.fill();

  }

  // 遠山

  ctx.fillStyle="#b6dfc7";

  ctx.beginPath();

  ctx.moveTo(0,GROUND);

  for(let x=0;x<=W+100;x+=100){

    ctx.lineTo(

      x,

      GROUND-55-(x%200===0?15:0)

    );

    ctx.lineTo(x+100,GROUND);

  }

  ctx.closePath();

  ctx.fill();

  // 地面

  ctx.fillStyle="#86c46e";

  ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle="#548d46";

  ctx.fillRect(0,GROUND,W,5);

  // 地面移動線條

  ctx.fillStyle="#4e9b47";

  const offset=distance%60;

  for(let x=-60;x<W+60;x+=60){

    ctx.fillRect(x-offset,GROUND+23,24,4);

  }

}

function drawDino(){

  const h=ducking&&dino.onGround?32:60;

  const y=dino.y+(60-h);

  const colors=[

    "",

    "#63b84e",

    "#318e48",

    "#358caa",

    "#9358bd",

    "#e2a321"

  ];

  ctx.save();

  // 護盾光圈

  if(shields>0){

    ctx.strokeStyle="rgba(34,125,255,.7)";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.ellipse(

      dino.x+27,

      y+h/2,

      39,

      h/2+12,

      0,0,Math.PI*2

    );

    ctx.stroke();

  }

  ctx.fillStyle=colors[evolutionLevel];

  // 身體

  ctx.fillRect(

    dino.x+7,

    y+h*0.32,

    37,

    h*0.52

  );

  // 頭

  ctx.fillRect(

    dino.x+25,

    y,

    29,

    h*0.48

  );

  // 尾巴

  ctx.beginPath();

  ctx.moveTo(dino.x+10,y+h*0.58);

  ctx.lineTo(dino.x-15,y+h*0.42);

  ctx.lineTo(dino.x+9,y+h*0.79);

  ctx.fill();

  // 腳

  if(!ducking||!dino.onGround){

    const step=Math.sin(frame*0.4)*6;

    ctx.fillRect(

      dino.x+13,

      y+h*0.79,

      10,

      h*0.21+step

    );

    ctx.fillRect(

      dino.x+32,

      y+h*0.79,

      10,

      h*0.21-step

    );

  }

  // 眼睛

  ctx.fillStyle="white";

  ctx.fillRect(

    dino.x+43,

    y+Math.max(5,h*0.12),

    7,7

  );

  ctx.fillStyle="#111";

  ctx.fillRect(

    dino.x+47,

    y+Math.max(7,h*0.14),

    3,3

  );

  // 進化尖刺

  if(evolutionLevel>=2){

    ctx.fillStyle="#ffe48b";

    for(let i=0;i<3;i++){

      ctx.beginPath();

      ctx.moveTo(dino.x+12+i*12,y+h*0.34);

      ctx.lineTo(dino.x+17+i*12,y+h*0.13);

      ctx.lineTo(dino.x+23+i*12,y+h*0.34);

      ctx.fill();

    }

  }

  // 高等級龍角

  if(evolutionLevel>=4){

    ctx.fillStyle="#f4e1ff";

    ctx.beginPath();

    ctx.moveTo(dino.x+30,y+4);

    ctx.lineTo(dino.x+28,y-18);

    ctx.lineTo(dino.x+42,y+4);

    ctx.fill();

  }

  // 傳說龍翅膀

  if(evolutionLevel===5){

    ctx.fillStyle="#f6c94e";

    ctx.beginPath();

    ctx.moveTo(dino.x+14,y+h*0.5);

    ctx.lineTo(dino.x-15,y-20);

    ctx.lineTo(dino.x+2,y+h*0.15);

    ctx.lineTo(dino.x+20,y+h*0.25);

    ctx.fill();

  }

  ctx.restore();

}

function drawRock(o){

  ctx.fillStyle="#777d87";

  ctx.beginPath();

  ctx.moveTo(o.x,o.y+o.h);

  ctx.lineTo(o.x+5,o.y+13);

  ctx.lineTo(o.x+18,o.y);

  ctx.lineTo(o.x+33,o.y+9);

  ctx.lineTo(o.x+o.w,o.y+o.h);

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle="#aeb5be";

  ctx.fillRect(o.x+12,o.y+14,10,5);

}

function drawBird(o){

  const flap=Math.sin(o.flap)*12;

  // 鳥身

  ctx.fillStyle="#784f98";

  ctx.beginPath();

  ctx.ellipse(

    o.x+27,

    o.y+14,

    22,12,

    0,0,Math.PI*2

  );

  ctx.fill();

  // 翅膀

  ctx.fillStyle="#a67ac5";

  ctx.beginPath();

  ctx.moveTo(o.x+23,o.y+14);

  ctx.lineTo(o.x+8,o.y-8+flap);

  ctx.lineTo(o.x+42,o.y+8);

  ctx.fill();

  // 鳥嘴

  ctx.fillStyle="#ffc247";

  ctx.beginPath();

  ctx.moveTo(o.x+48,o.y+11);

  ctx.lineTo(o.x+65,o.y+15);

  ctx.lineTo(o.x+48,o.y+19);

  ctx.fill();

  // 眼睛

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(o.x+42,o.y+10,4,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(o.x+43,o.y+10,2,0,Math.PI*2);

  ctx.fill();

}

function drawItem(item){

  const y=item.y+Math.sin(item.phase)*6;

  ctx.font="29px Arial";

  ctx.textAlign="center";

  const icons={

    gem:"💎",

    shield:"🛡️",

    boost:"⚡"

  };

  ctx.fillText(

    icons[item.type],

    item.x+15,

    y+27

  );

}

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();

  obstacles.forEach(o=>{

    if(o.type==="bird"){

      drawBird(o);

    }else{

      drawRock(o);

    }

  });

  items.forEach(drawItem);

  drawDino();

  // 上方關卡提示

  ctx.fillStyle="rgba(255,255,255,.75)";

  ctx.fillRect(12,10,185,34);

  ctx.fillStyle="#20547a";

  ctx.font="bold 19px Arial";

  ctx.textAlign="left";

  ctx.fillText(

    "第 "+level+" 關  🚀 "+speed.toFixed(1),

    22,34

  );

  if(level>=2){

    ctx.fillStyle="#8d368d";

    ctx.font="bold 15px Arial";

    ctx.fillText("🐦 小心飛鳥！",500,32);

  }

}

/* ==========================

   11. 遊戲主循環

========================== */

function loop(time){

  if(!running)return;

  if(!lastTime)lastTime=time;

  // 限制單次更新幅度，避免切換頁面時突然暴衝

  const dt=Math.min(

    (time-lastTime)/16.667,

    2

  );

  lastTime=time;

  update(dt);

  draw();

  if(running){

    animationId=requestAnimationFrame(loop);

  }

}

/* ==========================

   12. 死亡與重新挑戰

========================== */

function gameOver(){

  running=false;

  ducking=false;

  playHit();

  const final=Math.floor(score);

  if(final>best){

    best=final;

    try{

      localStorage.setItem(

        "dinoWaveBest4",

        String(best)

      );

    }catch(e){}

  }

  $("finalScore").textContent=final;

  $("bestScore").textContent=best;

  $("finalGems").textContent=gems;

  $("duckBtn").classList.remove("pressed");

  gamePanel.classList.add("hidden");

  endPanel.classList.remove("hidden");

}

$("restartBtn").onclick=()=>{

  unlockAudio();

  endPanel.classList.add("hidden");

  gamePanel.classList.add("hidden");

  trainingPanel.classList.remove("hidden");

  correct=0;

  evolutionLevel=1;

  usedQuestions=[];

  $("evolution").textContent=evolutionNames[1];

  $("correctCount").textContent="0";

  nextQuestion();

};

/* ==========================

   13. 初始化

========================== */

nextQuestion();

document.addEventListener(

  "touchmove",

  e=>{

    if(e.target.closest(".controls")){

      e.preventDefault();

    }

  },

  {passive:false}

);

</script>
