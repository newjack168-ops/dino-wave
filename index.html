/* =========================

   音效系統

========================= */

function initAudio(){

if(!soundOn)return;

try{

const AudioContextClass=

window.AudioContext||window.webkitAudioContext;

if(!AudioContextClass)return;

if(!audioCtx){

audioCtx=new AudioContextClass();

}

if(audioCtx.state==="suspended"){

audioCtx.resume().catch(()=>{});

}

}catch(e){}

}

function tone(freq,duration=0.12,type="sine",volume=.16,delay=0){

if(!soundOn)return;

initAudio();

if(!audioCtx)return;

try{

let now=audioCtx.currentTime+delay;

let osc=audioCtx.createOscillator();

let gain=audioCtx.createGain();

osc.type=type;

osc.frequency.setValueAtTime(freq,now);

gain.gain.setValueAtTime(.001,now);

gain.gain.exponentialRampToValueAtTime(

Math.max(.001,volume),now+.012

);

gain.gain.exponentialRampToValueAtTime(

.001,now+duration

);

osc.connect(gain);

gain.connect(audioCtx.destination);

osc.start(now);

osc.stop(now+duration+.02);

}catch(e){}

}

function playSound(name){

if(!soundOn)return;

if(name==="jump"){

tone(380,.1,"square",.07);

tone(580,.13,"sine",.09,.08);

}

if(name==="correct"){

tone(520,.12,"sine",.15);

tone(780,.18,"sine",.15,.13);

}

if(name==="wrong"){

tone(250,.18,"sawtooth",.07);

tone(170,.2,"sawtooth",.07,.17);

}

if(name==="evolve"){

tone(400,.13,"triangle",.15);

tone(520,.13,"triangle",.15,.14);

tone(660,.13,"triangle",.15,.28);

tone(880,.3,"triangle",.17,.42);

}

if(name==="item"){

tone(700,.1,"sine",.12);

tone(1050,.2,"sine",.12,.1);

}

if(name==="hit"){

tone(180,.18,"sawtooth",.12);

}

if(name==="death"){

tone(420,.2,"sawtooth",.12);

tone(300,.2,"sawtooth",.12,.2);

tone(180,.35,"sawtooth",.12,.4);

}

if(name==="start"){

tone(440,.12,"triangle",.12);

tone(660,.12,"triangle",.12,.14);

tone(880,.22,"triangle",.12,.28);

}

}

function toggleSound(){

soundOn=!soundOn;

soundOn?"🔊 音效開啟":"🔇 音效關閉";

/* =========================

   題目系統

========================= */

let questionBag=[];

function shuffle(arr){

for(let i=arr.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=[arr[j],arr[i]];

}

return arr;

}

function nextQuestion(){

if(state!=="training")return;

if(questionBag.length===0){

questionBag=shuffle(

questions.map((_,i)=>i)

);

if(questionBag.length>1 &&

questionBag[questionBag.length-1]===lastQuestion){

questionBag.unshift(questionBag.pop());

}

}

let index=questionBag.pop();

if(index===lastQuestion && questionBag.length){

questionBag.unshift(index);

index=questionBag.pop();

}

lastQuestion=index;

currentQuestion=questions[index];

answering=false;

document.getElementById("trainQuestion").textContent=

currentQuestion[0];

document.getElementById("trainExplain").textContent="";

let box=document.getElementById("trainOptions");

box.innerHTML="";

currentQuestion[1].forEach((option,i)=>{

let b=document.createElement("button");

b.textContent=

String.fromCharCode(65+i)+"．"+option;

b.onclick=()=>answerTraining(i);

box.appendChild(b);

});

}

function getDinoLevel(){

if(correct>=10)return 5;

if(correct>=7)return 4;

if(correct>=4)return 3;

if(correct>=2)return 2;

return 1;

}

function updateDino(){

let lv=getDinoLevel();

let names=[

"🦖 Lv.1 小恐龍",

"🦕 Lv.2 迅猛龍",

"🛡️ Lv.3 裝甲龍",

"⚡ Lv.4 雷電龍",

"🐉 Lv.5 傳說龍"

];

let abilities=[

"基本跳躍",

"解鎖二段跳",

"二段跳＋開場護盾",

"二段跳＋強化跳躍＋護盾",

"傳說龍！雙護盾＋二段跳＋強化跳躍"

];

document.getElementById("dinoName").textContent=

names[lv-1];

document.getElementById("trainingInfo").textContent=

abilities[lv-1];

document.getElementById("correct").textContent=correct;

}

function answerTraining(i){

if(answering||state!=="training")return;

initAudio();

answering=true;

let q=currentQuestion;

let ok=i===q[2];

document.querySelectorAll("#trainOptions button")

.forEach(b=>b.disabled=true);

let oldLevel=getDinoLevel();

if(ok){

correct++;

playSound("correct");

updateDino();

if(getDinoLevel()>oldLevel){

playSound("evolve");

}

document.getElementById("trainExplain").textContent=

"✅ 答對！"+q[3];

}else{

playSound("wrong");

document.getElementById("trainExplain").textContent=

"❌ 答錯！正確答案："+q[1][q[2]]+

"。"+q[3];

}

setTimeout(()=>{

if(state==="training")nextQuestion();

},1400);

}

document.getElementById("level").textContent=level;

best=score;

document.getElementById("best").textContent=best;

try{

localStorage.setItem("dinoWaveBest3",best);

}catch(e){}

}

}

function startGame(){

initAudio();

gameSession++;

state="running";

score=0;

level=1;

frame=0;

speed=4;

boost=0;

invincible=0;

obstacles=[];

items=[];

dino.y=185;

dino.vy=0;

dino.jumps=0;

let lv=getDinoLevel();

shield=lv>=5?2:lv>=3?1:0;

document.getElementById("training").classList.add("hidden");

document.getElementById("gameArea").classList.remove("hidden");

document.getElementById("message").textContent=

"🦖 冒險開始！";

playSound("start");

updateStats();

}

function jump(){

if(state!=="running")return;

initAudio();

let maxJumps=getDinoLevel()>=2?2:1;

if(dino.jumps>=maxJumps)return;

dino.vy=getDinoLevel()>=4?-13:-11;

dino.jumps++;

playSound("jump");

}

function collision(o){

return dino.x<o.x+o.w &&

dino.x+35>o.x &&

dino.y<o.y+o.h &&

dino.y+40>o.y;

}

function hit(){

if(invincible>0)return;

if(shield>0){

shield--;

invincible=100;

playSound("hit");

document.getElementById("message").textContent=

"🛡️ 護盾抵擋一次傷害！";

return;

}

gameOver();

}

function gameOver(){

if(state!=="running")return;

state="over";

playSound("death");

document.getElementById("message").textContent=

"💀 遊戲結束！得分："+score+

"分。點擊重新開始，再次挑戰！";

updateStats();

}

function restart(){

gameSession++;

state="training";

correct=0;

score=0;

level=1;

frame=0;

obstacles=[];

items=[];

questionBag=[];

lastQuestion=-1;

document.getElementById("training").classList.remove("hidden");

document.getElementById("gameArea").classList.add("hidden");

updateDino();

updateStats();

nextQuestion();

}

/* =========================

   遊戲畫面

========================= */

function draw(){

requestAnimationFrame(draw);

ctx.clearRect(0,0,600,280);

ctx.fillStyle="#dff6ff";

ctx.fillRect(0,0,600,280);

/* 波形 */

ctx.strokeStyle="#42b8db";

ctx.lineWidth=3;

ctx.beginPath();

for(let x=0;x<=600;x+=4){

let y=55+18*Math.sin((x+frame*2)/35);

if(x===0)ctx.moveTo(x,y);

else ctx.lineTo(x,y);

}

ctx.stroke();

/* 地面 */

ctx.fillStyle="#82ce8c";

ctx.fillRect(0,230,600,50);

ctx.fillStyle="#3e9e55";

ctx.fillRect(0,228,600,4);

ctx.font="14px Arial";

ctx.fillStyle="#176a86";

ctx.fillText(

"🌊 波峰・波谷・波長・頻率・波速",

12,22

);

/* 遊戲進行 */

if(state==="running"){

frame++;

level=Math.floor(score/200)+1;

speed=4+Math.min(level*.35,3);

if(boost>0){

boost--;

speed+=1.5;

}

if(invincible>0)invincible--;

/* 重力 */

dino.vy+=.6;

dino.y+=dino.vy;

if(dino.y>=185){

dino.y=185;

dino.vy=0;

dino.jumps=0;

}

/* 產生障礙物 */

if(frame%100===0){

let type=Math.floor(Math.random()*3);

obstacles.push({

x:610,

y:type===0?203:type===1?197:205,

w:type===1?34:26,

h:type===1?33:25,

type:type

});

}

/* 隨機掉寶 */

if(frame%180===0){

items.push({

x:610,

y:rand(135,175),

w:26,

h:26,

type:Math.floor(Math.random()*3)

});

}

/* 障礙物移動 */

for(let o of obstacles){

o.x-=speed;

if(collision(o)){

o.x=-100;

hit();

if(state!=="running")break;

}

}

/* 道具移動 */

if(state==="running"){

for(let o of items){

o.x-=speed;

if(collision(o)){

o.x=-100;

if(o.type===0){

shield++;

document.getElementById("message").textContent=

"🛡️ 獲得護盾！";

}

if(o.type===1){

boost=240;

document.getElementById("message").textContent=

"⚡ 獲得加速！";

}

if(o.type===2){

score+=50;

document.getElementById("message").textContent=

"💎 獲得50分！";

}

playSound("item");

}

}

}

obstacles=obstacles.filter(o=>o.x>-50);

items=items.filter(o=>o.x>-50);

if(frame%10===0){

score+=2;

}

updateStats();

}

/* 畫恐龍 */

let lv=getDinoLevel();

let icon=

lv===5?"🐉":

lv===4?"⚡":

lv===3?"🦖":

lv===2?"🦕":"🦖";

if(!(invincible>0 && frame%8<4)){

ctx.font="43px Arial";

ctx.fillText(icon,dino.x,dino.y+40);

}

/* 畫障礙 */

obstacles.forEach(o=>{

ctx.fillStyle=

o.type===0?"#795548":

o.type===1?"#8e44ad":"#e67e22";

ctx.beginPath();

if(o.type===1){

ctx.fillRect(o.x,o.y,o.w,o.h);

}else{

ctx.moveTo(o.x,o.y+o.h);

ctx.lineTo(o.x+o.w/2,o.y);

ctx.lineTo(o.x+o.w,o.y+o.h);

ctx.fill();

}

});

/* 畫道具 */

items.forEach(o=>{

ctx.font="25px Arial";

ctx.fillText(

["🛡️","⚡","💎"][o.type],

o.x,o.y+24

);

});

/* 護盾 */

if(shield>0){

ctx.strokeStyle="#a35cff";

ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(

dino.x+20,

dino.y+20,

32,

0,

Math.PI*2

);

ctx.stroke();

ctx.font="15px Arial";

ctx.fillStyle="#7135b9";

ctx.fillText("護盾×"+shield,10,105);

}

/* 結束畫面 */

if(state==="over"){

ctx.fillStyle="rgba(0,0,0,.35)";

ctx.fillRect(0,0,600,280);

ctx.fillStyle="white";

ctx.font="bold 38px Arial";

ctx.textAlign="center";

ctx.fillText("遊戲結束",300,130);

ctx.font="24px Arial";

ctx.fillText("得分："+score,300,170);

ctx.textAlign="left";

}

}

canvas.addEventListener("pointerdown",jump);

document.addEventListener("keydown",e=>{

if(e.code==="Space"){

e.preventDefault();

jump();

}

});

updateDino();

nextQuestion();

draw();

</script>
